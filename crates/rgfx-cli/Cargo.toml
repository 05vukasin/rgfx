[package]
name = "rgfx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "The rgfx command-line binary: argument parsing, media detection, config, and viewer dispatch."
keywords = ["terminal", "graphics", "image", "video", "cli"]
categories = ["command-line-utilities", "multimedia", "rendering"]

[[bin]]
name = "rgfx"
path = "src/main.rs"

[lib]
name = "rgfx_cli"
path = "src/lib.rs"

[dependencies]
rgfx-core = { path = "../rgfx-core" }
rgfx-image = { path = "../rgfx-image" }
rgfx-terminal = { path = "../rgfx-terminal" }
rgfx-3d = { path = "../rgfx-3d" }
rgfx-video = { path = "../rgfx-video" }
anyhow.workspace = true
clap.workspace = true
image.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
# Enables the ffprobe-backed `rgfx info` metadata for video files by turning on
# `rgfx-video`'s `ffmpeg` feature. Without it, `rgfx info <video>` still reports
# the container (from the file) and prints a clear note instead of probing.
default = []
ffmpeg = ["rgfx-video/ffmpeg"]
