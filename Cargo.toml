[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/05vukasin/rgfx"
authors = ["The rgfx authors"]

# Shared dependency versions. Member crates opt in with `<dep>.workspace = true`.
# Do not change a version here without flagging it — other crates' branches depend on it.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
glam = "0.30"
image = "0.25"
thiserror = "2"
tobj = "4"
stl_io = "0.11"
gltf = "1"
rayon = "1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
criterion = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
